server {
    listen 3100;

    # Design-/Wireframe-Prototypen (statisch, für Founder-Review)
    location /preview/ {
        alias /usr/share/nginx/html/preview/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://sprossa-test-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://192.168.178.188:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}