# ─────────────────────────────────────────────────────────────────────────────
# SPROSSA – LOKALE TESTINSTANZ (Staging)
# Proxy über Caddy (wie in Produktion), damit relative /api/ fetches funktionieren
# ─────────────────────────────────────────────────────────────────────────────
services:
  proxy:
    image: nginx:alpine
    container_name: sprossa-test-proxy
    ports:
      - "3100:3100"
    volumes:
      - ./nginx.test.conf:/etc/nginx/conf.d/default.conf
      - /home/mrjaws/sprossa-preview:/usr/share/nginx/html/preview:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sprossa-test-db
    environment:
      POSTGRES_USER: sprossa
      POSTGRES_PASSWORD: sprossa
      POSTGRES_DB: sprossa_test
    ports:
      - "5433:5432"
    volumes:
      - sprossa_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprossa -d sprossa_test"]
      interval: 5s
      timeout: 3s
      retries: 8

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sprossa-test-backend
    env_file:
      - .env.test
    environment:
      MM_APP_NAME: "Sprossa TEST API"
      MM_DEBUG: "true"
      MM_DATABASE_URL: "postgresql+asyncpg://sprossa:sprossa@db:5432/sprossa_test"
      MM_DATABASE_URL_SYNC: "postgresql://sprossa:***@db:5432/sprossa_test"
      MM_SECRET_KEY: "sprossa-TEST-secret-key-281014"
      MM_SMTP_HOST: "smtp.strato.de"
      MM_SMTP_PORT: "${MM_SMTP_PORT:-587}"
      MM_SMTP_USE_TLS: "${MM_SMTP_USE_TLS:-true}"
      MM_SMTP_FROM: "hallo@sprossa.de"
      MM_SMTP_FROM_NAME: "Sprossa"
      # MM_SMTP_USERNAME + MM_SMTP_PASSWORD kommen via env_file (.env.test):
      # NICHT hier interpolieren, sonst überschreibt die leere Interpolation den Wert.
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sprossa-test-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sprossa_test_pgdata: